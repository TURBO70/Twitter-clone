name: CI - Test then Dockerize

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: 🧪 Run Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: 🧾 Checkout code
        uses: actions/checkout@v3

      - name: 📥 Install dependencies
        run: npm install

      - name: 🧪 Run tests
        run: npm test

      - name: 📝 Make a change (update timestamp)
        run: |
          date > timestamp.txt
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add timestamp.txt
          git commit -m "chore: update timestamp"
          git push

  docker:
    name: 🐳 Build Docker Image
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: 🧾 Checkout code
        uses: actions/checkout@v3

      - name: 🐳 Build app Docker image
        run: docker build -t twitter-clone-app .
